name: Sync upstream data
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-data.mjs
      - run: |
          git config user.name "whiteboard-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/companies.json public/api/companies.json
          git diff --cached --quiet || git commit -m "chore: sync company data ($(date -u +%Y-%m-%d))"
          git push
